<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Ilusão da Escolha — Ceará Científico</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }

    body {
      background:#f5f5f0;
      min-height:100vh;
      color:#1a1a1a;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:20px;
    }

    .header { text-align:center; margin-bottom:20px; }
    .header h1 {
      font-size:24px;
      color:#006B3F;
      font-weight:800;
      letter-spacing:1px;
    }
    .header .faixa {
      width:80px; height:4px; background:#FFCC29;
      margin:10px auto 0; border-radius:2px;
    }

    /* ── App ── */
    .app-conteudo { width:100%; max-width:920px; display:flex; flex-direction:column; align-items:center; }

    /* ── Pergunta ── */
    .pergunta-box {
      width:100%; background:white; border-radius:12px;
      padding:16px; margin-bottom:16px;
      display:flex; gap:12px; align-items:flex-end;
      border:2px solid #e0e0e0;
    }
    .pergunta-box textarea {
      flex:1; min-height:48px; border-radius:8px;
      border:2px solid #ddd; background:#fafafa;
      color:#1a1a1a; padding:12px; font-size:15px;
      resize:none; transition:.3s;
    }
    .pergunta-box textarea:focus { outline:none; border-color:#006B3F; }

    .btn-enviar {
      padding:12px 28px; border-radius:8px; border:none;
      background:#006B3F;
      color:white; font-size:15px; font-weight:600;
      cursor:pointer; transition:.3s; white-space:nowrap; height:48px;
    }
    .btn-enviar:hover { background:#005a34; }
    .btn-enviar:disabled { opacity:.4; cursor:not-allowed; }

    /* ── Conexões ── */
    .conexao { display:flex; justify-content:center; margin-bottom:6px; }
    .linha-v { width:2px; height:18px; background:#ccc; }
    .linha-azul { width:2px; height:16px; background:#006B3F; }

    /* ── Grid 3 colunas ── */
    .grid-3 {
      width:100%; display:grid;
      grid-template-columns:1fr 1fr 1fr; gap:14px;
    }

    .conexoes-grid { width:100%; display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    .conexao-item { display:flex; justify-content:center; }

    /* ── Card IA ── */
    .ia-card {
      background:white; border-radius:12px; padding:14px;
      text-align:center; border:2px solid #e0e0e0;
    }
    .ia-card img {
      width:48px; height:48px; border-radius:10px;
      background:white; padding:4px; object-fit:cover;
    }
    .ia-card h3 { font-size:16px; margin-top:6px; color:#1a1a1a; }
    .ia-card p { font-size:11px; color:#888; }

    /* ── Resposta ── */
    .resposta-card {
      background:white; border-radius:12px; padding:14px;
      border:2px solid #FFCC29; min-height:180px;
      display:flex; flex-direction:column;
    }
    .resposta-label {
      font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:1px; color:#006B3F; margin-bottom:8px;
    }
    .resposta-texto {
      font-size:13px; line-height:1.6; color:#333; flex:1;
      overflow-y:auto; white-space:pre-wrap; max-height:280px;
    }
    .resposta-texto::-webkit-scrollbar { width:5px; }
    .resposta-texto::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }

    .placeholder { opacity:.3; text-align:center; padding-top:50px; font-size:14px; color:#999; }
    .carregando { display:flex; align-items:center; gap:8px; font-size:14px; color:#888; padding-top:40px; justify-content:center; }
    .spinner {
      width:18px; height:18px; border:2px solid #e0e0e0;
      border-top-color:#006B3F; border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .erro { color:#c0392b; font-size:13px; }


    @media(max-width:700px) {
      .grid-3, .conexoes-grid { grid-template-columns:1fr; }
      .conexoes-grid { display:none; }
      .pergunta-box { flex-direction:column; }
      .btn-enviar { width:100%; height:auto; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>A ILUSÃO DA ESCOLHA: COMO A IA INFLUENCIA NOSSAS DECISÕES</h1>
    <div class="faixa"></div>
  </div>

  <!-- APP -->
  <div class="app-conteudo ativo" id="appConteudo">

    <div class="pergunta-box">
      <textarea id="pergunta" placeholder="Tenho 17 anos e recebi uma boa proposta de emprego, mas precisaria trancar o ensino médio. O que devo fazer?" rows="2"></textarea>
      <button class="btn-enviar" id="btnEnviar" onclick="enviar()">Enviar</button>
    </div>

    <div class="conexao"><div class="linha-v"></div></div>

    <div class="grid-3">
      <div class="ia-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg"/>
        <h3>ChatGPT</h3><p>OpenAI</p>
      </div>
      <div class="ia-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/ec/DeepSeek_logo.svg"/>
        <h3>DeepSeek</h3><p>DeepSeek AI</p>
      </div>
      <div class="ia-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/8f/Google-gemini-icon.svg"/>
        <h3>Gemini</h3><p>Google</p>
      </div>
    </div>

    <div class="conexoes-grid">
      <div class="conexao-item"><div class="linha-azul"></div></div>
      <div class="conexao-item"><div class="linha-azul"></div></div>
      <div class="conexao-item"><div class="linha-azul"></div></div>
    </div>

    <div class="grid-3" style="margin-bottom:0">
      <div class="resposta-card">
        <div class="resposta-label">Resposta — ChatGPT</div>
        <div class="resposta-texto" id="texto-gpt"><div class="placeholder">Aguardando pergunta...</div></div>
      </div>
      <div class="resposta-card">
        <div class="resposta-label">Resposta — DeepSeek</div>
        <div class="resposta-texto" id="texto-deepseek"><div class="placeholder">Aguardando pergunta...</div></div>
      </div>
      <div class="resposta-card">
        <div class="resposta-label">Resposta — Gemini</div>
        <div class="resposta-texto" id="texto-gemini"><div class="placeholder">Aguardando pergunta...</div></div>
      </div>
    </div>

  </div>


<script>
  puter.quiet = true;

  const IAS = {
    gpt:    { nome:"ChatGPT", modelo:"gpt-4o-mini",          logo:"https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" },
    deepseek: { nome:"DeepSeek", modelo:"deepseek-v3.2", logo:"https://upload.wikimedia.org/wikipedia/commons/e/ec/DeepSeek_logo.svg" },
    gemini: { nome:"Gemini",  modelo:"gemini-2.5-flash-lite", logo:"https://upload.wikimedia.org/wikipedia/commons/8/8f/Google-gemini-icon.svg" }
  };

  let E = { pergunta:"", respostas:{} };

  // Sem tela de login — app direto

  // ── Enviar ──
  async function enviar() {
    const p = document.getElementById("pergunta").value.trim();
    if (!p) { document.getElementById("pergunta").focus(); return; }

    E.pergunta = p;
    E.respostas = {};

    const btn = document.getElementById("btnEnviar");
    btn.disabled = true;
    btn.textContent = "Enviando...";

    ["gpt","deepseek","gemini"].forEach(ia => {
      document.getElementById("texto-"+ia).innerHTML = '<div class="carregando"><div class="spinner"></div> Pensando...</div>';
    });

    let done = 0;

    ["gpt","deepseek","gemini"].forEach(async ia => {
      const cfg = IAS[ia];
      const el = document.getElementById("texto-"+ia);

      try {
        const res = await puter.ai.chat([
          { role:"system", content:"Responda sempre em português brasileiro." },
          { role:"user", content: p }
        ], { model: cfg.modelo });

        let txt = "";
        if (res?.message?.content) {
          txt = Array.isArray(res.message.content)
            ? res.message.content.map(c => c.text || c).join("")
            : res.message.content;
        } else if (typeof res === "string") {
          txt = res;
        } else {
          txt = JSON.stringify(res);
        }

        E.respostas[ia] = txt;
        el.textContent = txt;
      } catch(err) {
        E.respostas[ia] = "[Erro]";
        el.innerHTML = '<span class="erro">Erro: '+err.message+'</span>';
      }

      done++;
      if (done >= 3) {
        btn.disabled = false;
        btn.textContent = "Enviar";
      }
    });
  }

</script>

</body>
</html>
